<script>
const K='switch_v1',TABS=[['home','Início'],['visao','Visão'],['metas','Metas'],['salvar','Salvar']],SL={m:'Manhã',t:'Tarde',n:'Noite'};
const loc=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let S={start:loc(),name:'',alter:'',obj:[],who:'',traits:[],tasks:[],habits:[],journal:[],vision:[],goals:[],chat:[],viz:{},les:{}},tab='home',sub=null,tm=null,left=300;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{S._t=Date.now();setTimeout(()=>window.cloudPush&&window.cloudPush(),0);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Sem espaço para salvar. Faça um backup e remova imagens do quadro.')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id),val=id=>($(id)?.value||'').trim(),uid=()=>Date.now()+Math.random(),lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
const days=()=>Math.max(1,Math.floor((new Date(loc())-new Date(S.start))/864e5)+1);
function streak(h){let n=0,d=new Date(loc());if(!h.days[loc()])d.setDate(d.getDate()-1);while(h.days[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`,opts=()=>[...S.obj,...S.traits],hd=(t,p='')=>`<button class="o" data-a="back">‹ voltar</button><h1>${t}</h1>${p?`<p class="mut">${p}</p>`:''}`;
const ROWS=[['Todo dia',[['tarefas','✓','Tarefas','Organize sua manhã, tarde e noite'],['visualizacao','◉','Visualização diária','Cinco minutos vendo sua vida pronta'],['manifestacao','✎','Diário de manifestação','Escreva sua realidade desejada'],['habitos','▦','Hábitos','Crie e mantenha hábitos positivos'],['reflexao','☾','Reflexão diária','Reflita sobre seu progresso']]],['Aprender e olhar para trás',[['aulas','✺','Aulas com prática','Aprenda e aplique no mesmo dia'],['retro','↺','Retrospectiva','Revise sua jornada']]]];
